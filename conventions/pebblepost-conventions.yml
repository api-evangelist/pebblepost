x-gap:
- 'There is no conventions surface at all, so every cross-cutting question an
  integrator has — how do I retry safely, how do I page, which header carries my
  credential, what do I quote when something breaks — is answerable only by asking an
  account manager. The single highest-value fix is publishing an idempotency rule for
  the conversion tag, because duplicate conversion events directly distort the Revenue,
  Conversions, CVR, CPA and ROAS metrics PebblePost bills and reports against.'
- 'The two API hosts disagree with each other on error envelope and on correlation
  headers. Consistency across api.pebblepost.com and api.pbbl.co would be a
  no-documentation-required improvement.'
