apis:
- name: PebblePost JavaScript Tag
  description: 'The PebblePost JavaScript tag is the provider''s public client-side
    integration surface. Brands drop a script on their site that populates a window._pp
    array with a Brand ID (brid) and Brand Customer ID (brcid), plus optional conversion
    fields (orderId, orderValue), email and sessionId, then asynchronously loads a
    per-brand collector script from cdn.pbbl.co. It is the mechanism PebblePost uses
    to capture website intent and conversion events that drive Programmatic Direct
    Mail and Performance CTV targeting and attribution.'
  humanURL: https://docs.pebblepost.com/article/6-pebblepost-javascript-tag-installation-guide
  baseURL: https://cdn.pbbl.co
  tags:
  - Tag Management
  - Conversion Tracking
  - Advertising
  properties:
  - type: Documentation
    url: https://docs.pebblepost.com/article/6-pebblepost-javascript-tag-installation-guide
  - type: Components
    url: components/pebblepost-components.yml
- name: PebblePost Platform API
  description: 'A live but publicly undocumented platform API surface behind the PebblePost
    PDM Manager application. Two hosts respond: api.pebblepost.com (an Express service
    that answers GET /health with {"status":"UP"} and returns a JSON error envelope
    of {message, errorType} on unknown paths) and api.pbbl.co (an AWS API Gateway that
    answers every path with HTTP 403 Missing Authentication Token). PebblePost publishes
    no API reference, OpenAPI definition, or self-serve credential flow for either host;
    access is arranged through a PebblePost account team.'
  humanURL: https://www.pebblepost.com/platform/
  baseURL: https://api.pebblepost.com
  tags:
  - Marketing
  - Direct Mail
  - Advertising
  properties:
  - type: Authentication
    url: authentication/pebblepost-authentication.yml
  - type: ErrorCatalog
    url: errors/pebblepost-problem-types.yml
