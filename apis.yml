aid: pebblepost
name: PebblePost
description: 'PebblePost is a New York-based commerce marketing platform that pioneered
  Programmatic Direct Mail (PDM) and now also operates a Performance CTV product. Its
  Performance Marketing Engine turns first-party website intent signals, household
  identity and transaction data — surfaced through the PebblePost Graph — into targeted
  physical mail and connected-TV campaigns for retail and direct-to-consumer brands,
  with conversion measurement reported through a Performance Dashboard. Brands integrate
  by installing the PebblePost JavaScript tag (a window._pp client-side collector served
  from cdn.pbbl.co) and by syncing commerce data through connectors such as Shopify.
  Live API hosts run at api.pebblepost.com and api.pbbl.co, but PebblePost publishes
  no public developer portal, API reference, OpenAPI definition or self-serve API keys
  — API access is arranged through a PebblePost account team.'
