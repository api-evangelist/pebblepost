x-gap:
- 'PebblePost publishes nothing an operator could use to plan around change: no
  changelog, no versioning statement, no deprecation policy and no status page. A brand
  running the tag on its checkout pages has no way to learn that the tag changed, and
  no page to check when conversions stop arriving.'
- 'The unclaimed pebblepost.statuspage.io subdomain is a small but real hygiene issue —
  it resolves and returns 200, so an automated checker (or a customer) can easily
  mistake it for a status page that PebblePost operates.'
