# NOTHING IN THE OPERATIONAL LIFECYCLE IS PUBLISHED. No status page, no changelog, no
# release notes, no versioning policy, no deprecation policy, no SLA. Each was checked
# individually and each is a recorded negative below. Consequently this file is wired
# as `Lifecycle` ONLY — it deliberately carries NO `StatusPage` and NO `Deprecation`
# pointer in apis.yml, because those pointers assert the provider publishes those
# things and PebblePost does not.
versioning:
  policy_published: false
  scheme: null
  version_in_path: false
  version_header: null
  note: 'No version segment was observed on either live host. api.pebblepost.com
    answers /health at the root with no version prefix, and /v1 returns the same 404
    envelope as any other unknown path, so there is no evidence of a /v1 namespace.'
  evidence:
  - url: https://api.pebblepost.com/v1
    status: 404
  - url: https://api.pebblepost.com/v1/openapi.json
    status: 404
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: 'No deprecation policy page exists and there is no OpenAPI in which operations
    could be marked deprecated. No Sunset or Deprecation response header was returned
    on any probed path.'
status_page:
  published: false
  url: null
  note: 'CHECKED AND FALSE — and the check is worth recording because the obvious
    probe LOOKS like a hit. https://pebblepost.statuspage.io/ returns HTTP 200, but it
    is an unclaimed Statuspage subdomain that redirects to Atlassian''s own Statuspage
    marketing page (final URL https://www.atlassian.com/software/statuspage, <title>
    "Real-Time Incident Communication with Statuspage | Atlassian"). It is NOT a
    PebblePost status page. status.pebblepost.com and status.pbbl.co do not resolve.'
  evidence:
  - url: https://pebblepost.statuspage.io/
    status: 200
    resolved_to: https://www.atlassian.com/software/statuspage
    verdict: false-positive
  - url: https://status.pebblepost.com/
    status: 000
    observed: does not resolve
  - url: https://status.pbbl.co/
    status: 000
    observed: does not resolve
changelog:
  published: false
  url: null
  note: 'No changelog, release-notes or "what''s new" surface. The help center''s four
    collections (Getting Started, Performance Dashboard Access, Performance Dashboard
