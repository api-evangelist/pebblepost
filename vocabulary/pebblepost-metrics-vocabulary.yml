x-gap:
- 'The glossary defines the metrics but nothing binds them to a machine-readable
  schema — no field names, no types, no units, no currency. Revenue, AOV, Ad Spend and
  CPA are all monetary and no currency is stated anywhere.'
- 'PebblePost''s own tag documentation is a strict subset of what its integration
  partners document. Two collected fields — `end_url` (Synthetic Endpoint) and `tags`
  (Customer Tag) — appear in Tealium''s published mapping for the PebblePost tag but
  in none of PebblePost''s own articles, so a brand reading only PebblePost''s guide
  does not learn everything the tag can send.'
