# THE ONE CONTROLLED VOCABULARY PEBBLEPOST ACTUALLY PUBLISHES. PebblePost ships no
# OpenAPI and no object reference, but it does publish a definitional glossary for the
# Performance Dashboard, and every definition below is quoted verbatim from that
# article. A second block captures the field names PebblePost exposes through its
# client-side tag, taken from PebblePost's own installation guide and from Tealium's
# published tag mapping. Nothing here is invented; where PebblePost gives no definition,
# the field carries no definition.
