false_positives:
- host: https://trust.pebblepost.com
  vendor: Vanta Trust Center
  observed_status: 200
  verdict: NOT-A-HIT
  detail: 'The Vanta-hosted trust center is a single-page app with a catch-all route:
    EVERY path returns HTTP 200 with content-type text/html and the identical Vanta
    app shell. /security.txt, /.well-known/security.txt and /.well-known/agent-card.json
    all "succeed", and so does a deliberately nonsense control path. None of them is a
    document. Recorded here explicitly so a future round does not credit PebblePost
    with a security.txt or an agent card it does not serve.'
  probes:
  - {path: /security.txt, status: 200, content_type: text/html}
  - {path: /.well-known/security.txt, status: 200, content_type: text/html}
  - {path: /.well-known/agent-card.json, status: 200, content_type: text/html}
  - {path: /definitely-not-a-real-path-xyz123, status: 200, content_type: text/html,
     note: 'control probe — proves the 200 is a catch-all, not a document'}
- host: https://pebblepost.statuspage.io
  observed_status: 200
  verdict: NOT-A-HIT
  detail: 'Unclaimed Statuspage subdomain that redirects to Atlassian''s own Statuspage
    marketing page. Not a PebblePost status page. Recorded in
    lifecycle/pebblepost-lifecycle.yml.'
other_machine_readable_surfaces:
- host: https://www.pebblepost.com
  path: /wp-json/
  status: 200
  type: wordpress-rest-index
  detail: 'The marketing site is WordPress and its REST discovery document is publicly
    readable: 242 routes across 11 namespaces, self-describing with per-route methods
    and args. NINE of the eleven namespaces are stock WordPress or vendor plugins
    (wp/v2, oembed/1.0, yoast/v1, wpe/cache-plugin/v1, wpe_sign_on_plugin/v1,
    duplicate-post/v1, regenerate-thumbnails/v1, wp-site-health/v1, wp-block-editor/v1,
    wp-abilities/v1). ONE is first-party: `pp-rc/v1`, exposing POST
    /wp-json/pp-rc/v1/create-run, which backs the public ROI calculator at
    https://www.pebblepost.com/roi-calculator/.'
  first_party_namespace:
    namespace: pp-rc/v1
    routes:
    - {method: GET, path: /wp-json/pp-rc/v1, description: namespace index}
    - {method: POST, path: /wp-json/pp-rc/v1/create-run, args_declared: none,
       description: 'backs the ROI calculator; declares no arguments in the REST index'}
  verdict: NOT-THE-PRODUCT-API
  note: 'Recorded for completeness and NOT wired as an API entry in apis.yml. This is
    the content-management layer of a WordPress marketing site plus one lead-capture
    plugin route — it is not the PebblePost platform API, it is not documented, and
    presenting it as PebblePost''s API would misrepresent the company. It is noted
    because it is, ironically, the only self-describing machine-readable HTTP
    interface PebblePost serves anonymously.'
- host: https://www.pebblepost.com
  path: /feed/
  status: 200
  type: rss
  detail: WordPress RSS feed for the company blog.
