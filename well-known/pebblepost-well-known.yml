x-gap:
- 'PebblePost publishes no /.well-known/security.txt (RFC 9116). A security researcher
  has no machine-discoverable contact or disclosure policy; the only published address
  is privacy@pebblepost.com in the privacy policy.'
- 'The Vanta trust center answers 200 on every path including /.well-known/*, which
  means automated posture checkers can be fooled into recording documents PebblePost
  does not serve. Serving a real security.txt on www.pebblepost.com would both close
  the RFC 9116 gap and remove the ambiguity.'
