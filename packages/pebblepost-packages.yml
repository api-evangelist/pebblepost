x-gap:
- 'PebblePost ships no SDK in any language. Every server-side integration — the Shopify
  data sync above all — is performed by PebblePost against the BRAND''s API using
  credentials the brand hands over, which inverts the normal direction and removes any
  need for a client library. The consequence is that a brand''s engineers have nothing
  to install, nothing to version, and nothing to read.'
- 'The one distributed artifact, the JavaScript tag, is unversioned and unpinned. There
  is no SRI hash, no version in the URL, and no release notes, so a brand cannot audit
  what code is executing on its own checkout pages.'
