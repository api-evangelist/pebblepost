x-gap:
  - The tag's collector endpoint, event schema and response contract are not documented
    anywhere public — only the input variables are. There is no versioning statement
    for the tag and no consent/CMP integration guidance in the installation article.
  - 'PebblePost''s partners document PebblePost''s own integration surface better than
    PebblePost does. Tealium publishes the full field mapping including two fields
    (end_url, tags) absent from PebblePost''s guide; Elevar publishes a GTM install
    walkthrough; Rockerbox documents the outbound log-file feed. A brand reading only
    docs.pebblepost.com sees the smallest version of the integration.'
  - 'The 2023 Shopify public-app announcement is not reflected in the integration
    documentation and no app listing is findable, so the published instruction remains
    to email an API key and password to an account manager — the exact practice the
    announcement said it was replacing.'
