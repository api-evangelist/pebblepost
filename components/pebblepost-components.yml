- name: Tealium iQ Tag Management
  docs: https://docs.tealium.com/client-side-tags/pebblepost-tag/
  mechanism: 'PebblePost ships as a vendor tag in the Tealium iQ catalogue. Configured
    with a single parameter, "PebblePost Marketer ID" (integer, provided by PebblePost),
    then mapped to six destination variables — email, end_url, tags (Standard) and
    order_id, order_total, customer_id (E-Commerce). Recommended load rule: All Pages.'
